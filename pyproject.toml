[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aging_metaclock"
version = "0.1.1"
description = "Reproducible analysis and plotting workflows for MetaClock"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anndata==0.12.7",
    "joblib==1.5.2",
    "lightgbm==4.6.0",
    "lifelines==0.30.3",
    "matplotlib==3.10.8",
    "mrmr-selection==0.2.8",
    "numpy==2.3.5",
    "pandas==2.3.3",
    "pymupdf==1.26.6",
    "pyarrow==23.0.1",
    "pyaging==0.1.30",
    "rdata==1.0.0",
    "scikit-learn==1.8.0",
    "scipy==1.17.0",
    "statsmodels==0.14.6",
    "torch==2.9.1",
]

[tool.uv]
package = true

[tool.setuptools]
packages = ["metaclock"]
